[project]
name = "selmakit"
version = "0.1.30"
description = "Minimal multi-channel agent framework built on pydantic-ai"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gkvoelkl", email = "gkvoelkl@nelson-games.de" }]
keywords = [
    "agent",
    "agent-framework",
    "pydantic-ai",
    "llm",
    "ollama",
    "telegram",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Core = agent loop + WebChat channel + sessions/memory/cron. Everything that
# only some deployments need is an extra below; each is imported lazily at its
# use site, so a core-only install degrades with a logged warning, not a crash.
dependencies = [
    # No tracing backend is a dependency: selmakit only exports OTLP/HTTP spans
    # to whatever collector `tracing.endpoint` points at, and only when
    # `tracing.enabled` is set. See selmakit/tracing.py.
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "pydantic-ai[duckduckgo,web-fetch]>=2.33.0",
    # Core since the default capability set uses the harness FileSystem
    # (sandboxed file tools) and Skills (deferred skill loading).
    "pydantic-ai-harness>=0.24.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "httpx>=0.27",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.41.0",
]

[project.optional-dependencies]
# Streamlit dashboard (selmakit.dashboard / `selmakit dashboard`).
dashboard = [
    "streamlit>=1.0",
]
# Telegram channel (channels.telegram.enabled in selmakit.json).
telegram = [
    "python-telegram-bot>=22.6",
]
# No `tracing` extra: selmakit.tracing.setup() is built on the Logfire SDK,
# which pydantic-ai already requires — the OTel SDK and the OTLP/HTTP exporter
# come with it, so tracing works on a core-only install.
# Sub-agent delegation (see subagents in selmakit.json). The harness it needs
# is a core dependency now, so this extra is empty and kept only so existing
# `--extra subagents` / `selmakit[subagents]` installs keep resolving.
subagents = []
# Everything — the batteries-included install the repo's start.sh assumes.
all = [
    "selmakit[dashboard,telegram,subagents]",
]

[dependency-groups]
# Dev-only tooling: installed by `uv sync` for a checkout, never shipped to
# users of the published package (dependency groups are not part of the wheel).
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "ruff>=0.16",
]

[project.scripts]
selmakit = "selmakit.cli:main"

[project.urls]
Homepage = "https://github.com/gkvoelkl/python-selmakit"
Repository = "https://github.com/gkvoelkl/python-selmakit"
Issues = "https://github.com/gkvoelkl/python-selmakit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# Deliberately narrower than ruff's default set. Out of the box ruff reports
# ~125 findings here, and almost all of them are this codebase working as
# designed: BLE001 (blind-except) flags the degrade-with-a-warning pattern the
# whole extras architecture is built on, and UP006 is cosmetic because every
# module has `from __future__ import annotations`. A linter that prints 125
# lines per run gets ignored, so keep the pyflakes core plus only the groups
# that have actually caught bugs here:
#   ASYNC — blocking calls on the event loop. The gateway runs channels, worker,
#           heartbeat and cron in one asyncio.gather(), so one blocking call
#           stalls every one of them, not just the turn that made it.
#   PLW   — pylint warnings (e.g. subprocess.run without an explicit check).
#   FURB  — modernizations that are real simplifications, not style churn.
select = ["E4", "E7", "E9", "F", "ASYNC", "PLW", "FURB"]

[tool.hatch.build.targets.wheel]
packages = ["selmakit"]

[tool.hatch.build.targets.sdist]
# Keep doc/, examples/, images/ and the start scripts — they are useful when
# reading the sdist. Only editor/CI cruft is dropped.
exclude = [".github", ".gitignore"]
