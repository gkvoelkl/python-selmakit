[project]
name = "selmakit"
version = "0.1.23"
description = "Minimal multi-channel agent framework built on pydantic-ai"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gkvoelkl", email = "gkvoelkl@nelson-games.de" }]
keywords = [
    "agent",
    "agent-framework",
    "pydantic-ai",
    "llm",
    "ollama",
    "telegram",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Core = agent loop + WebChat channel + sessions/memory/cron. Everything that
# only some deployments need is an extra below; each is imported lazily at its
# use site, so a core-only install degrades with a logged warning, not a crash.
dependencies = [
    # arize-phoenix is intentionally NOT a dependency. It is the full Phoenix
    # *server* — installing it drags in ~43 packages (boto3, scikit-learn,
    # scipy, SQLAlchemy, strawberry-graphql). Run it standalone (Docker) and
    # talk to it over OTLP — see start.sh / README.
    # (Its old `pydantic-ai-slim<2` pin is gone: 19.x requires >=2.0.0.)
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "pydantic-ai[duckduckgo,web-fetch]>=2.23.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "httpx>=0.27",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.41.0",
]

[project.optional-dependencies]
# Streamlit dashboard (selmakit.dashboard / `selmakit dashboard`).
dashboard = [
    "streamlit>=1.0",
]
# Telegram channel (channels.telegram.enabled in selmakit.json).
telegram = [
    "python-telegram-bot>=22.6",
]
# No `tracing` extra: selmakit.tracing.setup() is built on the Logfire SDK,
# which pydantic-ai already requires — the OTel SDK and the OTLP/HTTP exporter
# come with it, so tracing works on a core-only install.
# Opt-in sub-agent delegation via pydantic-ai-harness (see subagents in
# selmakit.json). Install with: uv sync --extra subagents
subagents = [
    "pydantic-ai-harness>=0.16.0",
]
# Everything — the batteries-included install the repo's start.sh assumes.
all = [
    "selmakit[dashboard,telegram,subagents]",
]

[project.scripts]
selmakit = "selmakit.cli:main"

[project.urls]
Homepage = "https://github.com/gkvoelkl/python-selmakit"
Repository = "https://github.com/gkvoelkl/python-selmakit"
Issues = "https://github.com/gkvoelkl/python-selmakit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selmakit"]

[tool.hatch.build.targets.sdist]
# Keep doc/, examples/, images/ and the start scripts — they are useful when
# reading the sdist. Only editor/CI cruft is dropped.
exclude = [".github", ".gitignore"]
